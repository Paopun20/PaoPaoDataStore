site_name: PPDS Documentation
site_description: "Documentation for PaoPao's DataStore Modules"
site_author: "PaoPaoDev (Paopun20)"
site_url: https://paopun20.github.io/PaoPaoDataStore/
repo_url: https://github.com/Paopun20/PaoPaoDataStore
repo_name: "PaoPao's DataStore Module"

theme:
  name: material
  icon:
    logo: material/database
  favicon: images/favicon.png
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.integrate
    - content.code.back-to-top
  palette:
    - scheme: slate            # Dark Developer Focus (default)
      primary: "#1E1E1E"
      accent: "#61DAFB"
      toggle:
      icon: material/weather-night
      name: Switch to Light Mode
      background:
      default: "#1E1E1E"
      paper: "#1E1E1E"
      default: true
    - scheme: default          # Light Developer Focus
      primary: "#FFFFFF"
      accent: "#1A1A1A"
      toggle:
      icon: material/brightness-7
      name: Switch to Dark Mode
      background:
      default: "#FFFFFF"
      paper: "#FFFFFF"

nav:
  - Home: index.md
  - tutorial:
      - Setup: tutorial/setup.md
  - Reference: 
      - API Reference: reference/api.md

plugins:
  - search:
      separator: '[\\s\\-,:!=\\[\\]()\"/] +|(?!\\b)(?=[A-Z][a-z])|\\.(?!\\d)|&[lg]t;|\\b(?=\\d{1,2}\\.\\d{1,2}\\.\\d{1,2})|[\p{P}\p{S}\p{C}\p{Z}]+'
  - swagger-ui-tag

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - footnotes
  - attr_list
  - def_list
  - abbr
  - admonition
  - codehilite
  - meta
  - sane_lists
  - md_in_html
  - nl2br
  - smarty
  - pymdownx.escapeall
  - pymdownx.arithmatex
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.tilde
  - pymdownx.highlight
  - pymdownx.emoji
  - pymdownx.tabbed
