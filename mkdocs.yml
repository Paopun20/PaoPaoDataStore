site_name: PPDS Documentation
site_description: "Documentation for PaoPao's DataStore Modules"
site_author: "PaoPaoDev (Paopun20)"
site_url: https://paopun20.github.io/PaoPaoDataStore/
repo_url: https://github.com/Paopun20/PaoPaoDataStore
repo_name: "PaoPao's DataStore Module"

theme:
  name: material
  icon:
    logo: material/database
  favicon: images/favicon.png
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
  palette:
    - scheme: slate            # True Dark as default
      primary: "#000000"       # Black
      accent: "#FFFFFF"        # White text/icons
      toggle:
        icon: material/weather-night
        name: Switch to Light Mode (not recommended)
      background:
        default: "#000000"
        paper: "#000000"
      default: true
    - scheme: default          # True Light
      primary: "#FFFFFF"
      accent: "#000000"
      toggle:
        icon: material/brightness-7
        name: Switch to Dark Mode
      background:
        default: "#FFFFFF"
        paper: "#FFFFFF"

nav:
  - Home: index.md
  - tutorial:
      Setting up: tutorial/setup.md

plugins:
  - search:
      separator: '[\\s\\-,:!=\\[\\]()\"/] +|(?!\\b)(?=[A-Z][a-z])|\\.(?!\\d)|&[lg]t;'
  - swagger-ui-tag

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - footnotes
  - attr_list
  - def_list
  - abbr
  - admonition
  - codehilite
  - meta
  - sane_lists
  - md_in_html
  - nl2br
  - smarty
  - pymdownx.escapeall
  - pymdownx.arithmatex
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.tilde
  - pymdownx.highlight
  - pymdownx.emoji
  - pymdownx.tabbed
