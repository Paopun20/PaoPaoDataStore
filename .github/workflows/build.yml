name: Build RBXM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout files
        uses: actions/checkout@v3

      - name: Build
        uses: CompeyDev/rojo-build-action@0.1.5
        with:
          output: PaoPaoDataStore.rbxm
          type: rbxm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaoPaoDataStore
          path: PaoPaoDataStore.rbxm
