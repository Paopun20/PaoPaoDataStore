name: Wally Publish

on:
  workflow_dispatch: {}

jobs:
  prepare-wally-branch:
    runs-on: windows-latest

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup git user
      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Show repo root for debug
      - name: List files before copy
        run: dir

      # Cleanup root folder
      - name: Cleanup root folder
        shell: bash
        run: |
          find . -maxdepth 1 ! -name "temp" ! -name "src" ! -name "default.project.json" ! -name "wally.toml" ! -name "." ! -name ".." -exec rm -rf {} +
          echo ">>> Cleaned up unnecessary files"
          ls -alR

      # Download & install Wally
      - name: Download Wally CLI
        run: |
          curl -L https://github.com/UpliftGames/wally/releases/download/v0.3.2/wally-v0.3.2-win64.zip -o wally.zip
          tar -xf wally.zip
          move wally.exe C:\Windows\System32\
          del wally.zip
      
      - name: Wally login
        env:
          WALLY_TOKEN: ${{ secrets.WALLY_TOKEN }}
        run: wally login --token "${{ secrets.WALLY_TOKEN }}"

      # Wally login & publish
      - name: Wally Publish
        env:
          WALLY_TOKEN: ${{ secrets.WALLY_TOKEN }}
        run: |
          wally publish --verbose
