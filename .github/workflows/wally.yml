name: Wally Publish

on:
  workflow_dispatch: {}

jobs:
  publish-wally-package:
    runs-on: windows-latest

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup git user
      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Install Wally (Using the cleaner PowerShell method)
      - name: Download and Add Wally CLI to Path
        id: install_wally
        run: |
          $wally_version = "v0.3.2"
          $wally_dir = "$env:RUNNER_TEMP\wally"
          
          mkdir $wally_dir
          Invoke-WebRequest -Uri "https://github.com/UpliftGames/wally/releases/download/$wally_version/wally-$wally_version-win64.zip" -OutFile "$wally_dir\wally.zip"
          
          Expand-Archive -Path "$wally_dir\wally.zip" -DestinationPath $wally_dir -Force
          Remove-Item "$wally_dir\wally.zip"
          
          # This line adds the folder to the PATH for subsequent steps
          echo "$wally_dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell

      # CRITICAL STEP: Log in to create a persistent session/credential file
      - name: Wally Login
        run: wally login --token "${{ secrets.WALLY_TOKEN }}"
      
      # Publish (Now using the saved credential)
      - name: Wally Publish
        run: wally publish --verbose
