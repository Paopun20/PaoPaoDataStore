name: Wally Publish

on:
  workflow_dispatch: {}

jobs:
  prepare-wally-branch:
    runs-on: ubuntu-latest
    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup git user
      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Show repo root for debug
      - name: List files before copy
        run: ls -alR

      # Copy PaoPaoDataStore to root
      - name: Copy PaoPaoDataStore
        run: |
          cp -r src/PaoPaoDataStore/* .
          echo ">>> Copied PaoPaoDataStore to root"

      # Keep only necessary files (wally.toml, paopaodatastore.luau, default.project.json)
      - name: Cleanup root folder
        run: |
          find . -maxdepth 1 ! -name "." ! -name ".." ! -name "wally.toml" ! -name "paopaodatastore.luau" ! -name "default.project.json" -exec rm -rf {} +
          echo ">>> Cleaned up unnecessary files"
          ls -alR

      # Download & install Wally
      - name: Download Wally CLI
        run: |
          curl -L https://github.com/UpliftGames/wally/releases/download/v0.3.2/wally-v0.3.2-linux.zip -o wally.zip
          unzip wally.zip
          mv wally /usr/local/bin/wally
          chmod +x /usr/local/bin/wally
          rm -f wally.zip

      # Wally login & publish
      - name: Wally Publish
        run: |
          wally login
          wally publish --verbose
